name: Fetch Psiphon Source Once
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source
        run: |
          curl -L https://github.com/B3hnamR/PsiphonOverMITM/archive/refs/heads/main.zip -o source.zip
          unzip source.zip
          mkdir -p FetchedSource
          cp -r PsiphonOverMITM-main/* FetchedSource/
          rm -rf PsiphonOverMITM-main source.zip
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add FetchedSource/
          git commit -m "Fetch source from PsiphonOverMITM" || echo "No changes"
          git push